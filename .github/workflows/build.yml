# GitHub Actions: Create GitHub Release + Auto-update version.json
#
# Workflow mới (v3.0.127): KHÔNG build APK trên CI nữa vì user không add secrets
# (release keystore thiếu → APK build ra bị sign với Android Debug → user cài đè
#  lên bản local cũ release-signed bị "INSTALL_FAILED_UPDATE_INCOMPATIBLE").
#
# Workflow mới (LOCAL-FIRST):
#   1. Build APK trên máy local với release keystore
#      $ flutter build apk --release --target-platform android-arm64 --split-per-abi
#   2. Commit code + push
#   3. Tag version + push tag
#      $ git tag v3.0.127
#      $ git push origin v3.0.127
#   4. Action này chạy:
#      - Tạo GitHub Release (rỗng) cho tag
#      - Update version.json với link tới APK
#   5. User upload local APK vào release page qua web UI
#      (5 clicks: Edit release → drag APK vào Assets → Publish)
#
# Trigger: push tag v*.*.* HOẶC manual workflow_dispatch

name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (vd: 3.0.127) - phải khớp pubspec.yaml'
        required: true
        default: '3.0.127'

jobs:
  # ============================================================
  # GITHUB RELEASE - tạo release rỗng cho tag
  # User sẽ upload local APK (signed bằng release keystore) qua web UI
  # ============================================================
  create-release:
    name: 🚀 Create GitHub Release (empty - user uploads local APK)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # KHÔNG có files - user upload local APK manual
          body: |
            ## 📦 Cài đặt

            1. Tải file `his_mobile_v${{ github.ref_name }}_arm64.apk` ở mục **Assets** bên dưới
            2. Mở file APK trên điện thoại Android (Samsung A17)
            3. Cho phép cài từ nguồn không xác định (nếu được hỏi)
            4. Cài đè lên bản cũ (cùng signing key, không bị lỗi)

            > ⚠️ **Quan trọng**: APK này phải được sign bằng **release keystore** (`dc3abb...`),
            > không phải debug keystore. Nếu install bị lỗi "App not installed" → báo admin.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # AUTO-UPDATE version.json - commit file mới lên main branch
  # File này được app đọc để check update in-app
  # ============================================================
  update-version-json:
    name: 📝 Update version.json
    needs: [create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Write version.json
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # TAG_NAME = "v3.0.127" → version = "3.0.127"
          VERSION="${TAG_NAME#v}"
          echo "New version: $VERSION"
          APK_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/his_mobile_v${VERSION}_arm64.apk"
          echo "APK URL: $APK_URL"
          # Lấy message từ CHANGELOG.md (nếu có)
          if [ -f "CHANGELOG.md" ]; then
            MESSAGE=$(awk "/^## v$VERSION/{flag=1; next} /^## v/{flag=0} flag" CHANGELOG.md | head -3 | sed 's/^[[:space:]]*//' | tr '\n' ' ' | head -c 300)
            [ -z "$MESSAGE" ] && MESSAGE="Cập nhật phiên bản $VERSION"
          else
            MESSAGE="Cập nhật phiên bản $VERSION"
          fi
          echo "Message: $MESSAGE"
          # Ghi version.json
          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "apk_url": "$APK_URL",
            "message": "$MESSAGE"
          }
          EOF
          echo "--- version.json content ---"
          cat version.json

      - name: 📤 Commit + push version.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --staged --quiet; then
            echo "No version.json changes to commit"
          else
            git commit -m "chore: auto-update version.json to ${{ github.ref_name }}"
            git push origin main
            echo "✅ version.json pushed to main"
          fi
