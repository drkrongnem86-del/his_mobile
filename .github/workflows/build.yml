# GitHub Actions: Build APK (arm64) + AAB + Auto-release + Auto-update version.json
#
# Workflow:
#   1. git tag v3.0.95
#   2. git push origin v3.0.95
#   3. Action tự động:
#      - Build APK arm64 (Samsung A17 dùng cái này)
#      - Build AAB (Google Play Store)
#      - Tạo GitHub Release với APK + AAB đính kèm
#      - Update version.json với version mới + link tới release
#      - Commit version.json mới về repo
#
# Trigger: push tag v*.*.* HOẶC manual workflow_dispatch

name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (vd: 3.0.95) - phải khớp pubspec.yaml'
        required: true
        default: '3.0.95'

env:
  FLUTTER_VERSION: '3.41.7'
  JAVA_VERSION: '17'

jobs:
  # ============================================================
  # ANDROID - APK arm64 (cho Samsung A17 - direct install)
  # ============================================================
  build-apk:
    name: 📦 Build APK (arm64 - Samsung A17)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🏗️ Build APK (arm64 only)
        # Output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: his-mobile-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 90

  # ============================================================
  # ANDROID - AAB (Google Play Store format)
  # ============================================================
  build-aab:
    name: 📦 Build AAB (Google Play)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🏗️ Build AAB (universal)
        # Output: build/app/outputs/bundle/release/app-release.aab
        run: flutter build appbundle --release

      - name: 📤 Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: his-mobile-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

  # ============================================================
  # iOS - IPA (cho TestFlight / App Store / Ad-hoc)
  # v3.0.112: Thêm job build IPA song song với Android
  # v3.0.113: continue-on-error: true - IPA fail không block Create Release
  #            (iOS thiếu Apple certs, build sẽ fail cho đến khi add certs vào secrets)
  # ============================================================
  build-ipa:
    name: 🍎 Build IPA (iOS - macOS runner) - optional
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true  # KHÔNG block Create Release khi iOS thiếu certs
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      # v3.0.112: Chọn iOS deployment target trong Podfile nếu cần
      - name: 🍎 Set iOS deployment target
        run: |
          cd ios
          # iOS 13+ (mặc định Flutter 3.x)
          if [ -f "Podfile" ]; then
            sed -i '' 's/# platform :ios, .*/platform :ios, "13.0"/' Podfile || true
            echo "✅ Podfile updated"
          fi

      - name: 📦 Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
        env:
          # Tăng timeout cho pod install
          LC_ALL: en_US.UTF-8

      - name: 🏗️ Build IPA (no-codesign)
        # v3.0.112: Build KHÔNG cần code signing để workflow chạy được
        # Để cài được lên iPhone, cần thêm Apple Developer certs vào secrets
        # xem: https://docs.fastlane.tools/codesigning/guides/
        run: |
          flutter build ios --release --no-codesign --export-method=development
          # Tạo IPA từ Runner.app
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r "Runner.ipa" Payload
          ls -la Runner.ipa

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: his-mobile-ipa
          path: build/ios/iphoneos/Runner.ipa
          if-no-files-found: warn  # Không fail nếu IPA build lỗi (iOS chưa có certs)
          retention-days: 90

  # ============================================================
  # GITHUB RELEASE - tạo release tự động khi push tag
  # Bao gồm: APK arm64 (rename) + AAB + IPA
  # ============================================================
  create-release:
    name: 🚀 Create GitHub Release
    # v3.0.113: Bỏ build-ipa khỏi needs - IPA fail không block Create Release
    #            (iOS chưa có certs, IPA sẽ optional)
    needs: [build-apk, build-aab]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          continue-on-error: true  # iOS artifact có thể không có (no certs)

      - name: 📋 List artifacts
        run: |
          echo "=== Artifacts downloaded ==="
          ls -la artifacts/ 2>/dev/null || echo "No artifacts dir"
          for d in artifacts/*/; do
            if [ -d "$d" ]; then
              echo "--- $d ---"
              ls -la "$d"
            fi
          done

      - name: 🏷️ Rename APK theo version
        # Đổi tên app-arm64-v8a-release.apk → his_mobile_v{version}_arm64.apk
        # để URL trong version.json dễ đọc + stable
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd artifacts/his-mobile-apk-arm64/ 2>/dev/null || {
            echo "❌ APK artifact not found - skipping rename"
            exit 0
          }
          VERSION="${TAG_NAME#v}"
          mv -v app-arm64-v8a-release.apk "his_mobile_v${VERSION}_arm64.apk" 2>/dev/null || true
          ls -la 2>/dev/null || true

      - name: 🏷️ Rename IPA theo version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd artifacts/his-mobile-ipa/ 2>/dev/null || {
            echo "❌ IPA artifact not found (iOS build có thể đã skip) - skipping"
            exit 0
          }
          VERSION="${TAG_NAME#v}"
          if [ -f "Runner.ipa" ]; then
            mv -v Runner.ipa "his_mobile_v${VERSION}.ipa" 2>/dev/null || true
            ls -la 2>/dev/null
          else
            echo "❌ Runner.ipa not found"
          fi

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/his-mobile-apk-arm64/his_mobile_${{ github.ref_name }}_arm64.apk
            artifacts/his-mobile-aab/app-release.aab
            artifacts/his-mobile-ipa/his_mobile_${{ github.ref_name }}.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # AUTO-UPDATE version.json - tự động update sau khi Release tạo xong
  # File version.json được app đọc để check update
  # ============================================================
  update-version-json:
    name: 📝 Update version.json
    needs: [create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📝 Extract version + update version.json
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # TAG_NAME = "v3.0.95" → version = "3.0.95"
          VERSION="${TAG_NAME#v}"
          echo "New version: $VERSION"
          # URL cho APK arm64
          APK_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/his_mobile_v${VERSION}_arm64.apk"
          echo "APK URL: $APK_URL"
          # Lấy message từ CHANGELOG.md (nếu có)
          if [ -f "CHANGELOG.md" ]; then
            # Lấy phần giữa "## v$VERSION" và "## v" tiếp theo
            MESSAGE=$(awk "/^## v$VERSION/{flag=1; next} /^## v/{flag=0} flag" CHANGELOG.md | head -3 | sed 's/^[[:space:]]*//' | tr '\n' ' ' | head -c 300)
            [ -z "$MESSAGE" ] && MESSAGE="Cập nhật phiên bản $VERSION"
          else
            MESSAGE="Cập nhật phiên bản $VERSION"
          fi
          echo "Message: $MESSAGE"
          # Ghi version.json
          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "apk_url": "$APK_URL",
            "message": "$MESSAGE"
          }
          EOF
          echo "--- version.json content ---"
          cat version.json

      - name: 📤 Commit version.json
        # Pull --rebase trước để tránh conflict nếu có commit khác trên main
        # (vd: BS tự sửa CHANGELOG.md giữa workflow runs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add version.json
          if git diff --staged --quiet; then
            echo "No version.json changes to commit"
          else
            git commit -m "chore: auto-update version.json to ${{ github.ref_name }}"
            git push origin main
            echo "✅ version.json pushed"
          fi
