# Codemagic CI/CD Configuration cho HIS Mobile
# Workflow này build iOS IPA + Android APK + AAB song song
# Sử dụng: vào Codemagic UI → Workflows → chọn "Use codemagic.yaml"
#   hoặc tạo custom workflow với commands bên dưới.

workflows:
  # ===========================================
  # iOS Release IPA - cho test BrowserStack/TestFlight
  # ===========================================
  ios-release:
    name: iOS Release IPA
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Build IPA (no codesign - test build)
        script: flutter build ipa --release --no-codesign
      # Khi muốn cài lên iPhone thật/BrowserStack: thay --no-codesign bằng
      # --export-method=development hoặc dùng Apple cert/distribution profile
      # xem: https://docs.codemagic.io/yaml-code-signing/signing-ios/
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
    publishing:
      artifacts: false
      emails: null

  # ===========================================
  # Android Release - APK + AAB
  # ===========================================
  android-release:
    name: Android Release APK + AAB
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get packages
        script: flutter pub get
      # v3.0.118+: tự động dùng release keystore từ android/key.properties
      # (commit bị ignore .gitignore nên không vào repo)
      - name: Build APK (arm64)
        script: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      artifacts: false
      emails: null
